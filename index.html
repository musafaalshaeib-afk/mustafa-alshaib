    <script>
      // Prevent Vite HMR WebSocket connection errors from causing unhandled rejection console errors
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (String(event.reason.message || event.reason).includes('WebSocket') || String(event.reason.message || event.reason).includes('vite'))) {
          event.preventDefault();
        }
      });
    </script>
